version: "1.0"
rules:
  - {rule_id: TZ-STR-001, name: Наличие общих сведений, severity: major, scope: document, condition: {required_sections: ["Общие сведения"]}, message: "Отсутствует раздел общих сведений.", recommendation: "Добавить назначение, основание и область применения."}
  - {rule_id: TZ-STR-002, name: Наличие требований к надежности, severity: major, scope: document, condition: {required_sections: ["Требования к надежности"]}, message: "Отсутствуют требования к надежности.", recommendation: "Добавить показатели надежности и методы подтверждения."}
  - {rule_id: TZ-STR-003, name: Наличие требований безопасности, severity: critical, scope: document, condition: {required_sections: ["Требования безопасности"]}, message: "Отсутствуют требования безопасности.", recommendation: "Добавить применимые требования безопасности."}
  - {rule_id: TZ-STR-004, name: Наличие приемки, severity: major, scope: document, condition: {required_sections: ["Порядок приемки"]}, message: "Отсутствует порядок приемки.", recommendation: "Определить этапы, критерии и участников приемки."}
  - {rule_id: TZ-STR-005, name: Наличие испытаний, severity: major, scope: document, condition: {required_sections: ["Методы испытаний"]}, message: "Отсутствуют методы испытаний.", recommendation: "Описать способы подтверждения требований."}
  - {rule_id: TZ-STR-006, name: Комплектность, severity: minor, scope: document, condition: {required_sections: ["Комплектность"]}, message: "Отсутствует раздел комплектности.", recommendation: "Перечислить изделие, ЗИП и документацию."}
  - {rule_id: TZ-STR-007, name: Маркировка, severity: minor, scope: document, condition: {required_sections: ["Маркировка"]}, message: "Отсутствуют требования к маркировке.", recommendation: "Добавить состав и стойкость маркировки."}
  - {rule_id: TZ-STR-008, name: Упаковка, severity: minor, scope: document, condition: {required_sections: ["Упаковка"]}, message: "Отсутствуют требования к упаковке.", recommendation: "Добавить требования к упаковке и консервации."}
  - {rule_id: TZ-STR-009, name: Транспортирование, severity: minor, scope: document, condition: {required_sections: ["Транспортирование"]}, message: "Отсутствуют условия транспортирования.", recommendation: "Указать виды транспорта и климатические ограничения."}
  - {rule_id: TZ-STR-010, name: Хранение, severity: minor, scope: document, condition: {required_sections: ["Хранение"]}, message: "Отсутствуют условия хранения.", recommendation: "Указать срок и условия хранения."}
  - {rule_id: TZ-PHR-001, name: Обязательность соответствия, severity: major, scope: document, condition: {required_phrases: ["должен соответствовать"]}, message: "Нет нормативной формулировки соответствия.", recommendation: "Добавить проверяемую формулировку «должен соответствовать»."}
  - {rule_id: TZ-PHR-002, name: Критерии приемки, severity: major, scope: document, condition: {required_phrases: ["критерии приемки"]}, message: "Не определены критерии приемки.", recommendation: "Явно определить измеримые критерии приемки."}
  - {rule_id: TZ-BAN-001, name: Неконкретное качество, severity: minor, scope: paragraph, condition: {forbidden_phrases: ["высокое качество"]}, message: "Использована неизмеримая формулировка.", recommendation: "Заменить численным показателем и допуском."}
  - {rule_id: TZ-BAN-002, name: Неконкретный срок, severity: major, scope: paragraph, condition: {forbidden_phrases: ["в кратчайшие сроки"]}, message: "Срок не измерим.", recommendation: "Указать срок в календарных или рабочих днях."}
  - {rule_id: TZ-BAN-003, name: Необходимость без критерия, severity: minor, scope: paragraph, condition: {forbidden_phrases: ["при необходимости"]}, message: "Не определено условие необходимости.", recommendation: "Определить инициатора и объективное условие."}
  - {rule_id: TZ-REF-001, name: Ссылки на ГОСТ, severity: major, scope: document, condition: {required_reference_pattern: "ГОСТ\\s+(?:Р\\s+)?[0-9]"}, message: "Не найдены ссылки на применимые ГОСТ.", recommendation: "Указать обозначения и годы нормативных документов."}
  - {rule_id: TZ-TBL-001, name: Таблица требований, severity: major, scope: table, condition: {table_caption: "Таблица требований", required_table_columns: ["Параметр", "Значение", "Единица измерения"], require_non_empty: true}, message: "Таблица требований отсутствует или неполна.", recommendation: "Добавить обязательные колонки и заполнить все ячейки."}
  - {rule_id: TZ-TBL-002, name: Матрица испытаний, severity: major, scope: table, condition: {table_caption: "Испытания", required_table_columns: ["Требование", "Метод", "Критерий"], require_non_empty: true}, message: "Матрица испытаний отсутствует или неполна.", recommendation: "Связать требования с методами и критериями испытаний."}
  - {rule_id: TZ-CON-001, name: Согласованность напряжения, severity: critical, scope: document, condition: {consistent_parameter: "напряжение"}, message: "В документе противоречат значения напряжения.", recommendation: "Установить единое значение либо описать режимы."}
  - {rule_id: TZ-CON-002, name: Согласованность температуры, severity: critical, scope: document, condition: {consistent_parameter: "температура"}, message: "В документе противоречат значения температуры.", recommendation: "Уточнить диапазоны и условия измерения температуры."}
  - {rule_id: TZ-CON-003, name: Согласованность срока службы, severity: major, scope: document, condition: {consistent_parameter: "срок службы"}, message: "Указаны разные значения срока службы.", recommendation: "Согласовать назначенный срок службы во всех разделах."}
