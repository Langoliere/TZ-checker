[project]
name = "tz-checker"
version = "0.1.0"
description = "Offline technical specification review service"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2", "celery[redis]>=5.4,<6", "fastapi>=0.115,<1",
  "httpx>=0.27,<1", "pgvector>=0.3,<1", "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3", "python-docx>=1.1,<2", "python-multipart>=0.0.12,<1",
  "pyyaml>=6,<7", "redis>=5,<6", "sqlalchemy>=2.0,<3", "structlog>=24,<26",
  "streamlit>=1.40,<2", "uvicorn[standard]>=0.32,<1"
]

[project.optional-dependencies]
dev = ["mypy>=1.13,<2", "pytest>=8,<9", "pytest-cov>=6,<7", "ruff>=0.8,<1", "types-PyYAML>=6,<7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tz_checker"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501", "E701", "E702"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
ignore_missing_imports = true
warn_return_any = false
